name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_VERSION: 1.0.${{ github.run_number }}
      DOTNET_NOLOGO: true
      VPK_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0 (Node 24)
        with:
          dotnet-version: 8.0.x
      - name: Build clean x64 installer
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path "$env:RUNNER_TEMP/vpk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.github/release/pack.ps1 -Version $env:PACKAGE_VERSION -Repository $env:GITHUB_REPOSITORY -Stage "$env:RUNNER_TEMP/companion" -Vpk "$env:RUNNER_TEMP/vpk/vpk.exe"
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
      - name: Sign installer and update feed
        run: |
          Set-Location "$env:RUNNER_TEMP/companion/release"
          foreach ($file in 'OpenClawCompanion-Setup.exe','releases.win.json') {
            cosign sign-blob --yes --bundle "$file.sigstore.json" $file
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cosign verify-blob --bundle "$file.sigstore.json" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity "https://github.com/$env:GITHUB_WORKFLOW_REF" $file
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Verify signed package with the companion's own update code
        run: |
          $env:OPENCLAW_RELEASE_VERIFY_DIR = "$env:RUNNER_TEMP/companion/release"
          dotnet test src/OpenClaw.Node.Tests -p:Platform=x64 "-p:ReleaseRepository=$env:GITHUB_REPOSITORY" --filter 'FullyQualifiedName~SignedReleaseTests'
      - name: Publish only verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-Location "$env:RUNNER_TEMP/companion/release"
          # Do not tag a superseded commit or promote an older CI rerun to latest.
          # The newer main build owns publication. No PAT is needed in CI.
          $main = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($main -cne $env:GITHUB_SHA) {
            Write-Host 'Main advanced during the build; skipping publication.'
            exit 0
          }
          $published = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($prior in $published) {
            if ($prior -match '^windows-(1\.0\.[1-9][0-9]*)$' -and [version]$Matches[1] -ge [version]$env:PACKAGE_VERSION) {
              Write-Host 'An equal or newer Windows package is already published; skipping publication.'
              exit 0
            }
          }
          $tag = "windows-$env:PACKAGE_VERSION"
          $files = @('OpenClawCompanion-Setup.exe','OpenClawCompanion-Setup.exe.sigstore.json','releases.win.json','releases.win.json.sigstore.json',"OpenClawCompanion-$env:PACKAGE_VERSION-full.nupkg")
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "Windows x64 · $env:PACKAGE_VERSION" --notes 'Per-user Windows installer. Download OpenClawCompanion-Setup.exe. Existing installed copies can update from the tray. This release provides Sigstore bundles; Setup is not Authenticode-signed.'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
